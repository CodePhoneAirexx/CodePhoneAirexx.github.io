
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airexx — YouTube Channel</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08090e;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

body.light {
  background: #f5f5f5;
  color: #1a1a1a;
}

.theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #ff0033;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: bold;
  z-index: 1000;
  transition: .2s;
}

.theme-toggle:hover {
  transform: scale(1.06);
  background: #ff5566;
}

header {
  text-align: center;
  padding: 55px 20px 35px;
  background: radial-gradient(ellipse at top, #28204b, #08090e 75%);
  transition: background 0.3s;
}

body.light header {
  background: radial-gradient(ellipse at top, #ffdddd, #f5f5f5 75%);
}

.avatar {
  width: 135px;
  height: 135px;
  border-radius: 50%;
  border: 4px solid #ff5566;
  object-fit: cover;
  box-shadow: 0 0 35px #ff556666;
  transition: border-color 0.3s, box-shadow 0.3s;
}

h1 {
  margin-top: 18px;
  font-size: 36px;
}

h1 a {
  color: inherit;
  text-decoration: none;
  transition: color 0.2s;
}

h1 a:hover {
  color: #ff5566;
}

.handle {
  color: #aaa;
  margin-top: 8px;
  transition: color 0.3s;
}

body.light .handle {
  color: #666;
}

.handle a {
  color: inherit;
  text-decoration: none;
  transition: color 0.2s;
}

.handle a:hover {
  color: #ff5566;
}

.subscribe {
  display: inline-block;
  margin-top: 22px;
  padding: 14px 28px;
  background: #ff0033;
  color: white;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  transition: .2s;
}

.subscribe:hover {
  transform: scale(1.06);
  background: #ff5566;
}

main {
  max-width: 1150px;
  margin: auto;
  padding: 25px 20px 60px;
}

h2 {
  margin: 30px 0 20px;
  font-size: 24px;
}

.videos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 22px;
}

.video {
  background: #151620;
  border: 1px solid #282936;
  border-radius: 15px;
  overflow: hidden;
  transition: .25s;
}

body.light .video {
  background: white;
  border: 1px solid #ddd;
}

.video:hover {
  transform: translateY(-5px);
  border-color: #ff5566;
  box-shadow: 0 5px 20px #ff556633;
}

.video img {
  display: block;
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
}

.video-info {
  padding: 15px;
}

.video h3 {
  font-size: 16px;
  line-height: 1.4;
  margin-bottom: 12px;
}

.video a {
  color: #ff5566;
  text-decoration: none;
  font-weight: bold;
  transition: color 0.2s;
}

.video a:hover {
  color: #ff0033;
}

.status {
  color: #999;
  text-align: center;
  padding: 20px;
}

body.light .status {
  color: #666;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
  border-top: 1px solid #222;
  transition: border-color 0.3s, color 0.3s;
}

body.light footer {
  color: #999;
  border-top: 1px solid #ddd;
}

</style>
</head>

<body>

<button class="theme-toggle" onclick="toggleTheme()">🌓 Тема</button>

<header>
  <img id="avatar" class="avatar"
  src="https://placehold.co/300x300/191525/ffffff?text=A"
  alt="Airexx Avatar">

  <h1>
    <a id="channelName" href="https://www.youtube.com/@Airexx_play" target="_blank">Airexx</a>
  </h1>
  <p class="handle">
    <a href="https://www.youtube.com/@Airexx_play" target="_blank">@Airexx_play</a>
  </p>
</header>

<main>

  <h2>🎬 Последние видео</h2>
  <div id="latest" class="videos">
    <p class="status">Загрузка видео...</p>
  </div>

  <h2>🔥 Популярные видео</h2>
  <div id="popular" class="videos">
    <p class="status">Загрузка популярных видео...</p>
  </div>

</main>

<footer>
  © 2026 Airexx | YouTube Channel
</footer>

<script>
const API_KEY = "AIzaSyBWa1LzC31chJroOA9YvSNI1VEt9JQAEHo";
const HANDLE = "@Airexx_play";

const API = "https://www.googleapis.com/youtube/v3/";

// Переключение темы
function toggleTheme() {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

// Загрузка сохраненной темы
function loadTheme() {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    document.body.classList.add('light');
  }
}

async function request(endpoint, params) {
  const url = new URL(API + endpoint);

  Object.entries({
    ...params,
    key: API_KEY
  }).forEach(([key, value]) => {
    url.searchParams.set(key, value);
  });

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Ошибка YouTube API: " + response.status);
  }

  return response.json();
}

function renderVideos(containerId, videos) {
  const container = document.getElementById(containerId);

  if (!videos.length) {
    container.innerHTML =
      '<p class="status">Видео пока не найдены.</p>';
    return;
  }

  container.innerHTML = videos.map(video => {
    const id = video.id.videoId || video.id;
    const snippet = video.snippet;

    const thumbnail =
      snippet.thumbnails.maxres?.url ||
      snippet.thumbnails.high?.url ||
      snippet.thumbnails.medium?.url;

    return `
      <article class="video">
        <a href="https://www.youtube.com/watch?v=${id}"
           target="_blank">
          <img src="${thumbnail}" alt="">
        </a>
        <div class="video-info">
          <h3>${escapeHTML(snippet.title)}</h3>
          <a href="https://www.youtube.com/watch?v=${id}"
             target="_blank">
            Смотреть видео →
          </a>
        </div>
      </article>
    `;
  }).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

async function loadChannel() {
  try {
    if (API_KEY === "ВСТАВЬ_СЮДА_API_KEY") {
      throw new Error("Добавь свой YouTube API Key в код.");
    }

    // Получаем информацию о канале
    const channelData = await request("channels", {
      part: "snippet,contentDetails",
      forHandle: HANDLE
    });

    if (!channelData.items?.length) {
      throw new Error("Канал не найден.");
    }

    const channel = channelData.items[0];

    document.getElementById("channelName").textContent =
      channel.snippet.title;

    document.getElementById("avatar").src =
      channel.snippet.thumbnails.high.url;

    const channelId = channel.id;
    const uploadsId =
      channel.contentDetails.relatedPlaylists.uploads;

    // Последние 3 видео
    const latestData = await request("playlistItems", {
      part: "snippet",
      playlistId: uploadsId,
      maxResults: 3
    });

    const latest = latestData.items
      .filter(item => item.snippet.resourceId?.videoId)
      .map(item => ({
        id: item.snippet.resourceId.videoId,
        snippet: item.snippet
      }));

    renderVideos("latest", latest);

    // 3 популярных видео
    const popularData = await request("search", {
      part: "snippet",
      channelId: channelId,
      type: "video",
      order: "viewCount",
      maxResults: 3
    });

    renderVideos("popular", popularData.items);

  } catch (error) {
    console.error(error);

    document.getElementById("latest").innerHTML =
      `<p class="status">${escapeHTML(error.message)}</p>`;

    document.getElementById("popular").innerHTML =
      '<p class="status">Не удалось загрузить видео.</p>';
  }
}

// Загружаем тему при старте
loadTheme();
loadChannel();
</script>

</body>
</html>
